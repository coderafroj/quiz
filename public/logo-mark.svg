<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background: flat, sharp-cornered, matches .card-frame treatment (no border-radius) -->
  <rect x="0" y="0" width="512" height="512" fill="#050505"/>
  <rect x="12" y="12" width="488" height="488" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>

  <!--
    The mark: a bold, hand-drawn "?" — the universal quiz symbol — with
    its dot replaced by a solid terminal-cursor block in the app's
    "correct answer" green, tying the coding/terminal identity to the
    quiz format without competing with the glyph's own legibility.
  -->
  <path d="M 190 175
           C 190 90 330 90 330 175
           C 330 235 255 225 255 275
           L 255 320"
        fill="none" stroke="#f7f7f5" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- terminal-cursor dot, in the app's accent-correct green -->
  <rect x="230" y="360" width="50" height="50" fill="#3ecf8e"/>
</svg>
